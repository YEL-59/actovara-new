name: EasyTemplate CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (Root, Backend, Frontend)
        run: npm run install:all

      - name: Lint Backend & Frontend
        run: npm run lint

      - name: Run Backend API & Security Smoke Tests
        run: npm test --prefix backend

      - name: Run Full-Stack Project & Contract Validation
        run: |
          chmod +x scripts/validate-contracts.sh scripts/validate-project.sh
          ./scripts/validate-contracts.sh
          ./scripts/validate-project.sh
